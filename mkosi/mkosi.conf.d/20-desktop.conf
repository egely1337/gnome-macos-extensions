# GNOME masaüstü. GNOME Yazılım ve PackageKit bilerek yok: uygulama mağazası
# Bazaar'dır ve Flatpak olarak ilk açılışta kurulur (bkz. preinstall.d).

[Content]
Packages=
        gdm
        gnome-shell
        gnome-session
        gnome-settings-daemon
        gnome-control-center
        gnome-initial-setup
        gnome-keyring
        gnome-menus
        gnome-backgrounds
        gnome-console
        gnome-disk-utility
        gnome-system-monitor
        gnome-user-docs
        gnome-shell-extensions
        nautilus
        gvfs
        gvfs-mtp
        gvfs-smb
        xdg-desktop-portal-gnome
        xdg-desktop-portal-gtk
        xdg-user-dirs-gtk
        gjs
        libadwaita
        gtk4
        glib2
        networkmanager
        modemmanager
        wpa_supplicant
        wireless-regdb
        bluez
        bluez-utils
        bolt
        pipewire
        pipewire-alsa
        pipewire-pulse
        pipewire-jack
        wireplumber
        power-profiles-daemon
        cups
        cups-pk-helper
        system-config-printer
        ibus
        mesa
        vulkan-intel
        vulkan-radeon
        vulkan-nouveau
        intel-media-driver
        libva-mesa-driver
        noto-fonts
        noto-fonts-emoji
        noto-fonts-cjk
        adwaita-fonts
        ttf-dejavu
        qemu-guest-agent
        spice-vdagent

KernelInitrdModules=/drivers/gpu/drm
