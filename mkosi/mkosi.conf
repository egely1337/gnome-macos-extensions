# mandarinOS: Arch tabanlı, değiştirilemez (immutable), A/B güncellemeli
# GNOME masaüstü.
#
# İmaj yalnızca /usr içerir. /usr, salt okunur bir EROFS bölümüdür; dm-verity
# ile korunur ve imzalanır. İki /usr yuvası (A/B) vardır: systemd-sysupdate
# yeni sürümü boştaki yuvaya yazar, systemd-boot yeni UKI'yi en fazla üç kez
# dener, açılış başarısız olursa eski sürüme kendiliğinden döner.
# Yazılabilir her şey (/etc katmanı, /var, /home) ilk açılışta systemd-repart'ın
# oluşturduğu kök bölümünde durur. Uygulamalar Flatpak ile gelir; mağaza
# Bazaar'dır.

[Config]
MinimumVersion=26

[Distribution]
Distribution=arch
Architecture=x86-64

[Build]
# Güncelleme sunucusu (bkz. mkosi.local.conf.example). Tanımsızsa imaj
# internetten güncelleme almaz.
Environment=MANDARIN_UPDATE_URL
ToolsTree=default
CacheDirectory=mkosi.cache
Incremental=yes
History=yes
# Depo kökünü /work/src'ye bağla: postinst eklentileri ve markayı oradan alır.
BuildSources=..

[Output]
OutputDirectory=mkosi.output
Format=disk
ImageId=mandarinOS
Output=%i_%v_%a
SplitArtifacts=uki,partitions
ManifestFormat=json

[Content]
Bootable=yes
Bootloader=systemd-boot
UnifiedKernelImages=yes
UnifiedKernelImageFormat=%i_%v_%a
ShimBootloader=none
KernelInitrdModules=default
InitrdProfiles=plymouth
KernelCommandLine=
        root=dissect
        mount.usr=dissect
        rw
        quiet
        splash
        plymouth.use-simpledrm
        systemd.image_policy=esp=unprotected:xbootldr=unprotected+unused+absent:usr=signed:root=unprotected+encrypted+absent:swap=encrypted+unprotected+unused+absent:home=unprotected+encrypted+absent:=ignore
        systemd.image_filter=usr=mandarinOS_*:usr-verity=mandarinOS_*:usr-verity-sig=mandarinOS_*:root=mandarinOS-*:swap=mandarinOS-*:home=mandarinOS-*
Hostname=mandarin
Locale=tr_TR.UTF-8
Keymap=trq
Timezone=Europe/Istanbul
WithDocs=yes
CleanPackageMetadata=no

Packages=
        base
        # Tüm diller hazır derlenmiş gelir; GNOME İlk Kurulum'da her dil seçilebilir.
        glibc-locales
        linux
        linux-firmware
        amd-ucode
        intel-ucode
        sof-firmware
        systemd
        systemd-ukify
        dbus-broker-units
        btrfs-progs
        dosfstools
        e2fsprogs
        erofs-utils
        exfatprogs
        ntfs-3g
        cryptsetup
        tpm2-tss
        tpm2-tools
        efibootmgr
        fwupd
        polkit
        sudo
        shadow
        util-linux
        bash-completion
        less
        nano
        vim
        man-db
        man-pages
        which
        jq
        curl
        wget
        unzip
        zip
        zstd
        openssh
        zram-generator
        plymouth
        flatpak
        xdg-desktop-portal
        # pacman yalnızca "pacman -Q" sorguları için kalır; /usr salt okunur
        # olduğundan paket kurulamaz.
        pacman
        archlinux-keyring

VolatilePackages=
        systemd
        systemd-ukify

RemoveFiles=
        /boot/*-ucode.img
        /var/cache/pacman/pkg

[Validation]
# "mkosi genkey" ile üretilen mkosi.key / mkosi.crt hem Secure Boot hem de
# dm-verity imzası için kullanılır. Anahtarı güvenli saklayın: güncellemeleri
# imzalamak için gerekir.
SecureBoot=yes
SecureBootAutoEnroll=yes
Verity=signed
SignExpectedPcr=yes

[Runtime]
RuntimeSize=40G
RAM=4G
CPUs=4
Firmware=uefi
