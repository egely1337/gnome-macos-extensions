# Kök bölümünü (/etc değişiklikleri, /var, /home) siler ve ilk açılış
# durumuna döner. /usr dokunulmaz.

[UKIProfile]
Profile=
        ID=factory-reset
        TITLE=Fabrika Ayarlarına Dön [DİKKAT: tüm veriler silinir]

Cmdline=
        root=dissect
        mount.usr=dissect
        systemd.factory_reset=1
        rw
        systemd.image_policy=esp=unprotected:xbootldr=unprotected+unused+absent:usr=signed:root=unprotected+encrypted+absent:swap=encrypted+unprotected+unused+absent:home=unprotected+encrypted+absent:=ignore
        systemd.image_filter=usr=mandarinOS_*:usr-verity=mandarinOS_*:usr-verity-sig=mandarinOS_*:root=mandarinOS-*:swap=mandarinOS-*:home=mandarinOS-*

SignExpectedPcr=yes
