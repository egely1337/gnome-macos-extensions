# USB'den açılışta "mandarinOS'u Kur" girişi: kökü tmpfs'te tutar ve
# systemd-sysinstall'ı çalıştırır. Hedef diskin bölümlerini
# /usr/lib/repart.d tanımlar; /usr yuvası A, USB'den blok blok kopyalanır.

[UKIProfile]
Profile=
        ID=install
        TITLE=mandarinOS'u Diske Kur

Cmdline=
        root=tmpfs
        mount.usr=dissect
        rw
        rd.systemd.mask=systemd-repart.service
        systemd.mask=systemd-repart.service
        systemd.unit=system-install.target
        systemd.image_policy=esp=unprotected:xbootldr=unprotected+unused+absent:usr=signed:=ignore
        systemd.image_filter=usr=mandarinOS_*:usr-verity=mandarinOS_*:usr-verity-sig=mandarinOS_*

SignExpectedPcr=no
