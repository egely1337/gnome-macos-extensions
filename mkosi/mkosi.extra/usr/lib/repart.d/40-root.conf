# Tek yazılabilir bölüm: /etc katmanı (/var/lib/mandarin/etc-overlay), /var
# ve /home. Diskte kalan tüm alanı kaplar. Fabrika ayarlarına dönüşte silinir.
# Tam disk şifreleme için Encrypt=tpm2 (veya key-file+tpm2) eklenebilir.

[Partition]
Type=root
Label=%M-root
Format=btrfs
Subvolumes=/home /var
MakeDirectories=/home /var /var/log/journal
SizeMinBytes=4G
Weight=1000
FactoryReset=yes
